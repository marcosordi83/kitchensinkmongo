<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Welcome to Spring MVC</title>
</head>
<body>
    <h1>Welcome to Spring MVC!</h1>
    
    <div>
        <p>You have successfully deployed a Spring MVC Application.</p>
    </div>
    
    <form th:action="@{/members/register}" th:object="${newMember}" method="post">
        <h2>Member Registration</h2>
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" th:value="${newMember != null ? newMember.name : ''}"/>
        </div>
        
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" th:value="${newMember != null ? newMember.email : ''}"/>
        </div>
        
        <div>
            <label for="phoneNumber">Phone #:</label>
            <input type="text" id="phoneNumber" name="phoneNumber" th:value="${newMember != null ? newMember.phoneNumber : ''}"/>
        </div>
        
        <button type="submit">Register</button>
    </form>
    
    <h2>Members</h2>
    <div th:if="${#lists.isEmpty(members)}">
        <em>No registered members.</em>
    </div>
    
    <table th:if="${not #lists.isEmpty(members)}">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone #</th>
                <th>REST URL</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="member : ${members}">
                <td th:text="${member.id}">1</td>
                <td th:text="${member.name}">John Doe</td>
                <td th:text="${member.email}">john@example.com</td>
                <td th:text="${member.phoneNumber}">123-456-7890</td>
                <td>
                    <a th:href="@{/members/{id}(id=${member.id})}">REST URL</a>
                </td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="5">
                    REST URL for all members: <a th:href="@{/members}">All Members</a>
                </td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
